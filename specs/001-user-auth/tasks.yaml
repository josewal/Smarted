tasks:
    branch: "001-user-auth"
    created: "2026-03-16"
    spec_path: "specs/001-user-auth/spec.yaml"
    plan_path: "specs/001-user-auth/plan.yaml"
summary:
    total_tasks: 34
    total_phases: 11
    parallel_opportunities: 12
    estimated_complexity: "high"
phases:
    - number: 1
      title: "Setup"
      purpose: "Install new dependencies and configure testing infrastructure"
      tasks:
        - id: "T001"
          title: "Install new server dependencies (nodemailer, express-rate-limit, @types/nodemailer)"
          status: "Completed"
          type: "setup"
          parallel: false
          story_id: null
          file_path: "server/package.json"
          dependencies: []
          acceptance_criteria:
            - "nodemailer ^6.9.0 is listed in server/package.json dependencies"
            - "express-rate-limit ^7.0.0 is listed in server/package.json dependencies"
            - "@types/nodemailer is listed in server/package.json devDependencies"
            - "npm install completes without errors from the monorepo root"
        - id: "T002"
          title: "Configure Vitest for server testing (server/vitest.config.ts)"
          status: "Completed"
          type: "setup"
          parallel: false
          story_id: null
          file_path: "server/vitest.config.ts"
          dependencies: ["T001"]
          acceptance_criteria:
            - "vitest ^3.0.0 and supertest are in server devDependencies"
            - "server/vitest.config.ts exists with TypeScript and ESM support"
            - "A 'test' script is added to server/package.json that runs vitest"
            - "Running 'npm test' in server/ exits cleanly with no tests found (not error)"
    - number: 2
      title: "Foundational"
      purpose: "Database schema changes, shared types, and core services that all user stories depend on"
      tasks:
        - id: "T003"
          title: "Create database migration 002_auth_enhancements.sql"
          status: "Completed"
          type: "implementation"
          parallel: true
          story_id: null
          file_path: "server/src/db/migrations/002_auth_enhancements.sql"
          dependencies: ["T001"]
          acceptance_criteria:
            - "Adds email_verified BOOLEAN NOT NULL DEFAULT false column to users table"
            - "Creates password_reset_tokens table with id (UUID PK), user_id (FK to users ON DELETE CASCADE), token_hash VARCHAR(255) NOT NULL, expires_at TIMESTAMPTZ NOT NULL, used_at TIMESTAMPTZ NULL, created_at TIMESTAMPTZ DEFAULT NOW()"
            - "Creates email_verification_tokens table with same structure as password_reset_tokens"
            - "Adds indexes on user_id for both token tables"
            - "Migration is idempotent (uses IF NOT EXISTS where appropriate)"
        - id: "T004"
          title: "Update shared/types.ts with email_verified and token types"
          status: "Completed"
          type: "implementation"
          parallel: true
          story_id: null
          file_path: "shared/types.ts"
          dependencies: ["T001"]
          acceptance_criteria:
            - "User interface includes email_verified: boolean field"
            - "New PasswordResetToken interface with id, user_id, token_hash, expires_at, used_at, created_at"
            - "New EmailVerificationToken interface with same fields"
            - "New request/response types for forgot-password, reset-password, change-password, verify-email endpoints"
            - "All types use import/export ES module syntax"
        - id: "T005"
          title: "Create token generation and hashing service (server/src/services/auth/tokens.ts)"
          status: "Completed"
          type: "implementation"
          parallel: true
          story_id: null
          file_path: "server/src/services/auth/tokens.ts"
          dependencies: ["T001"]
          acceptance_criteria:
            - "generateToken() returns a 32-byte crypto.randomBytes hex string"
            - "hashToken(token) returns SHA-256 hash of the input token"
            - "Uses Node.js built-in crypto module (no extra dependencies)"
            - "Functions are exported and typed"
        - id: "T006"
          title: "Create password validation and email normalization service (server/src/services/auth/validation.ts)"
          status: "Completed"
          type: "implementation"
          parallel: true
          story_id: null
          file_path: "server/src/services/auth/validation.ts"
          dependencies: ["T001"]
          acceptance_criteria:
            - "validatePassword(password) returns { valid: boolean, message?: string }"
            - "Rejects passwords shorter than 8 characters with descriptive message"
            - "normalizeEmail(email) returns lowercase trimmed email"
            - "Functions are exported and typed"
        - id: "T007"
          title: "Create email sender service with Nodemailer and console fallback (server/src/services/email/sender.ts)"
          status: "Completed"
          type: "implementation"
          parallel: true
          story_id: null
          file_path: "server/src/services/email/sender.ts"
          dependencies: ["T001"]
          acceptance_criteria:
            - "createTransport() uses SMTP config from environment variables (SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS)"
            - "Falls back to console.log email content when SMTP is not configured"
            - "sendEmail({ to, subject, html }) function sends via transporter or logs to console"
            - "Logs email sending errors but does not throw (fire-and-forget for non-critical emails)"
            - "Uses ES module import/export syntax"
        - id: "T008"
          title: "Create email templates for reset and verification (server/src/services/email/templates.ts)"
          status: "Completed"
          type: "implementation"
          parallel: true
          story_id: null
          file_path: "server/src/services/email/templates.ts"
          dependencies: ["T001"]
          acceptance_criteria:
            - "passwordResetEmail(resetUrl) returns { subject: string, html: string } with a reset link"
            - "emailVerificationEmail(verifyUrl) returns { subject: string, html: string } with a verification link"
            - "Templates include basic HTML structure with clear call-to-action links"
            - "Reset URL and verify URL are parameterized (not hardcoded)"
        - id: "T009"
          title: "Create auth query functions for tokens and verification (server/src/db/queries/auth.ts)"
          status: "Completed"
          type: "implementation"
          parallel: false
          story_id: null
          file_path: "server/src/db/queries/auth.ts"
          dependencies: ["T003", "T004"]
          acceptance_criteria:
            - "createPasswordResetToken(userId, tokenHash, expiresAt) inserts into password_reset_tokens"
            - "findValidPasswordResetToken(tokenHash) returns unexpired, unused token or null"
            - "markPasswordResetTokenUsed(tokenId) sets used_at to NOW()"
            - "createEmailVerificationToken(userId, tokenHash, expiresAt) inserts into email_verification_tokens"
            - "findValidEmailVerificationToken(tokenHash) returns unexpired, unused token or null"
            - "markEmailVerified(userId) sets email_verified = true on users table"
            - "updateUserPassword(userId, passwordHash) updates password_hash on users table"
            - "findUserByEmail(email) returns user row or null (parameterized query)"
            - "All queries use parameterized SQL ($1, $2, etc.)"
            - "All functions are typed with return types matching shared/types.ts"
        - id: "T010"
          title: "Create rate limiting middleware (server/src/middleware/rateLimit.ts)"
          status: "Completed"
          type: "implementation"
          parallel: true
          story_id: null
          file_path: "server/src/middleware/rateLimit.ts"
          dependencies: ["T001"]
          acceptance_criteria:
            - "authLimiter middleware limits to 10 requests per IP per 15-minute window"
            - "Returns 429 status with { error: 'too_many_requests', message: string } on limit exceeded"
            - "Uses express-rate-limit with in-memory store"
            - "Exported for use in route files"
    - number: 3
      title: "User Story 1 - Account Registration Enhancements"
      purpose: "Enhance existing registration with password validation, email normalization, and email_verified default"
      story_reference: "US-001"
      independent_test: "A new user can register with valid credentials and see email_verified: false in their profile; invalid passwords are rejected"
      tasks:
        - id: "T011"
          title: "Enhance register endpoint with password validation, email normalization, and email_verified (server/src/routes/auth.ts)"
          status: "Completed"
          type: "implementation"
          parallel: false
          story_id: "US-001"
          file_path: "server/src/routes/auth.ts"
          dependencies: ["T006", "T009"]
          acceptance_criteria:
            - "POST /api/auth/register validates password length >= 8 chars using validation service"
            - "Returns 400 with descriptive message if password is too short"
            - "Email is normalized (lowercase, trimmed) before storage and duplicate check"
            - "Response includes email_verified: false for new users"
            - "Rate limiting middleware is applied to register endpoint"
            - "Existing registration flow (bcrypt hashing, session creation, workspace creation) is preserved"
        - id: "T012"
          title: "Update Login.tsx registration form with password validation feedback (client/src/views/Login.tsx)"
          status: "Completed"
          type: "implementation"
          parallel: false
          story_id: "US-001"
          file_path: "client/src/views/Login.tsx"
          dependencies: ["T011"]
          acceptance_criteria:
            - "Registration form shows password minimum length requirement hint"
            - "Client-side validation prevents submission of passwords < 8 characters"
            - "Server-side validation errors are displayed to the user"
            - "Existing login/register toggle behavior is preserved"
    - number: 4
      title: "User Story 2 - Account Login Enhancements"
      purpose: "Harden login with generic error messages, email normalization, and rate limiting"
      story_reference: "US-002"
      independent_test: "Login with wrong password shows generic error; login with non-existent email shows same generic error; excessive attempts return 429"
      tasks:
        - id: "T013"
          title: "Enhance login endpoint with generic errors, email normalization, and rate limiting (server/src/routes/auth.ts)"
          status: "Completed"
          type: "implementation"
          parallel: false
          story_id: "US-002"
          file_path: "server/src/routes/auth.ts"
          dependencies: ["T006", "T010", "T011"]
          acceptance_criteria:
            - "POST /api/auth/login returns identical error message for non-existent email and wrong password"
            - "Error message is generic: 'Invalid email or password' (does not reveal email existence)"
            - "Email is normalized before lookup"
            - "Rate limiting middleware (authLimiter) is applied to login endpoint"
            - "Returns 429 when rate limit exceeded"
            - "Successful login response includes email_verified field"
        - id: "T014"
          title: "Enhance /me endpoint to return email_verified field (server/src/routes/auth.ts)"
          status: "Completed"
          type: "implementation"
          parallel: false
          story_id: "US-002"
          file_path: "server/src/routes/auth.ts"
          dependencies: ["T013"]
          acceptance_criteria:
            - "GET /api/auth/me response includes email_verified boolean"
            - "Query fetches email_verified from users table"
            - "Unauthenticated requests still return 401"
    - number: 5
      title: "User Story 3 - Session Persistence"
      purpose: "Handle session expiry gracefully with user-facing redirect and message"
      story_reference: "US-003"
      independent_test: "A user with expired session is redirected to login with 'session expired' message"
      tasks:
        - id: "T015"
          title: "Add session expiry detection and redirect with message (client/src/views/App.tsx, client/src/api/client.ts)"
          status: "Completed"
          type: "implementation"
          parallel: false
          story_id: "US-003"
          file_path: "client/src/views/App.tsx"
          dependencies: ["T014"]
          acceptance_criteria:
            - "API client intercepts 401 responses globally"
            - "On 401, user is redirected to login page with a query parameter (e.g., ?expired=1)"
            - "Login page shows 'Your session has expired. Please log in again.' when expired param is present"
            - "Normal logout does NOT show the session expired message"
            - "Session persistence across browser close still works (existing 7-day cookie unchanged)"
    - number: 6
