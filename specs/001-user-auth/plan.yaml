implementation_phases:
  - phase: 1
    name: "Database & Shared Types"
    goal: "Extend the database schema and shared type definitions for auth enhancements"
    deliverables:
      - "Migration 002_auth_enhancements.sql: add email_verified to users, create password_reset_tokens and email_verification_tokens tables"
      - "Updated User interface in shared/types.ts with email_verified field"
      - "New PasswordResetToken and EmailVerificationToken types in shared/types.ts"

  - phase: 2
    name: "Auth Services & Utilities"
    goal: "Build the backend service layer for tokens, validation, and email"
    dependencies:
      - "Phase 1"
    deliverables:
      - "Token service (services/auth/tokens.ts): generate and hash tokens with crypto"
      - "Validation service (services/auth/validation.ts): password rules, email normalization"
      - "Email sender service (services/email/sender.ts): Nodemailer with console fallback"
      - "Email templates (services/email/templates.ts): reset and verification HTML templates"
      - "Auth query functions (db/queries/auth.ts): token CRUD, user email verification updates"
      - "Unit tests for validation and token services"

  - phase: 3
    name: "Rate Limiting & Security Hardening"
    goal: "Add rate limiting to auth endpoints and harden existing security controls"
    dependencies:
      - "Phase 1"
    deliverables:
      - "Rate limiting middleware (middleware/rateLimit.ts) for login, register, and reset endpoints"
      - "Case-insensitive email handling in register and login"
      - "Password minimum length validation (8 chars) on register"
      - "Generic error messages on login failure"

  - phase: 4
    name: "Password Reset Flow"
    goal: "Implement the complete forgot-password and reset-password flow"
    dependencies:
      - "Phase 2"
      - "Phase 3"
    deliverables:
      - "POST /api/auth/forgot-password endpoint"
      - "POST /api/auth/reset-password endpoint"
      - "ForgotPassword.tsx view and route"
      - "ResetPassword.tsx view and route"
      - "usePasswordReset.ts viewmodel hook"
      - "Integration tests for password reset endpoints"

  - phase: 5
    name: "Password Change & Account Settings"
    goal: "Allow authenticated users to change their password from account settings"
    dependencies:
      - "Phase 2"
      - "Phase 3"
    deliverables:
      - "POST /api/auth/change-password endpoint"
      - "AccountSettings.tsx view and route"
      - "useAccountSettings.ts viewmodel hook"
      - "Integration tests for password change endpoint"

  - phase: 6
    name: "Email Verification"
    goal: "Send verification emails on registration and allow users to verify their email"
    dependencies:
      - "Phase 2"
    deliverables:
      - "POST /api/auth/verify-email endpoint"
      - "POST /api/auth/resend-verification endpoint"
      - "Verification email sent on registration"
      - "EmailVerificationBanner.tsx component"
      - "Updated App.tsx to show verification banner for unverified users"
      - "Integration tests for verification endpoints"

  - phase: 7
    name: "Frontend Polish & Edge Cases"
    goal: "Handle edge cases, improve UX, and ensure all acceptance scenarios pass"
    dependencies:
      - "Phase 4"
      - "Phase 5"
      - "Phase 6"
    deliverables:
      - "Session expiry redirect with message"
      - "Already-authenticated redirect from login/register pages"
      - "Browser back button protection after logout"
      - "Updated Login.tsx with forgot password link"
      - "Updated routing in App.tsx for new pages"
      - "End-to-end acceptance scenario validation"

open_questions:
  - question: "Should unverified users have limited access or full access with a reminder banner?"
    context: "Spec US-007 flags this as a clarification needed. Restricting access could frustrate new users; a banner is less disruptive."
    proposed_resolution: "Full access with a non-blocking reminder banner. Email verification is P2 and should not gate core functionality."
  - question: "Which SMTP provider should be used in production?"
    context: "Nodemailer is transport-agnostic but needs SMTP credentials configured."
    proposed_resolution: "Document supported providers in .env.example. Default to console logging in development. Production config is a deployment concern, not a code concern."

