        Nodemailer and express-rate-limit are proven, minimal libraries.
        No ORM, no unnecessary abstractions. crypto.randomBytes is stdlib.
    - name: "Type Safety End-to-End (PRIN-002)"
      status: "PASS"
      notes: |
        All new interfaces added to smarted-shared types.ts.
        New query functions fully typed. Route handlers typed.
    - name: "Separation of Concerns (PRIN-003)"
      status: "PASS"
      notes: |
        Email service in services/email/. Auth logic in routes/auth.ts.
        New frontend views follow MVM pattern with viewmodel hooks.
    - name: "Backend is Single Source of Truth (PRIN-004)"
      status: "PASS"
      notes: |
        All auth state managed server-side. Frontend calls API client.
        No client-side token storage or auth state duplication.
    - name: "SQL Injection Prevention (PRIN-005)"
      status: "PASS"
      notes: |
        All new queries use parameterized SQL ($1, $2).
        Query functions isolated in db/queries/ directory.
    - name: "Secrets Never in Code (PRIN-006)"
      status: "PASS"
      notes: |
        SMTP credentials, session secret loaded from environment variables.
        Development defaults clearly marked.
    - name: "Password Security (PRIN-007)"
      status: "PASS"
      notes: |
        bcrypt with cost factor >= 10 for all password operations.
        Session cookies httpOnly + secure in production. Reset tokens hashed.
    - name: "ES Modules Only (PRIN-008)"
      status: "PASS"
      notes: "All new code uses import/export syntax with .js extensions."
    - name: "Immutable Review History (PRIN-009)"
      status: "N/A"
      notes: "Auth feature does not touch review_logs table."
    - name: "Consistent API Response Shape (PRIN-010)"
      status: "PASS"
      notes: |
        Success: { data: T }. Error: { error: string, message: string }.
        HTTP status codes follow REST conventions.
    - name: "Monorepo Package Boundaries (PRIN-011)"
      status: "PASS"
      notes: |
        Shared types in smarted-shared. No cross-package imports
        between client and server.

research_findings:
  decisions:
    - topic: "Email delivery library"
      decision: "Nodemailer"
      rationale: |
        De facto standard for Node.js email. SMTP-agnostic so works with
        any provider (Mailgun, SES, Gmail, local dev tools like Ethereal).
        No vendor lock-in. Zero additional abstractions needed.
      alternatives_considered:
        - "SendGrid SDK — vendor-specific, adds unnecessary coupling"
        - "@aws-sdk/client-ses — AWS-specific, overkill for MVP"
        - "Resend — newer, less proven, paid-only"
    - topic: "Rate limiting approach"
      decision: "express-rate-limit with in-memory store"
      rationale: |
        Simple, proven middleware. In-memory store is appropriate for
        single-server deployment. Can upgrade to Redis store later if
        needed for horizontal scaling.
      alternatives_considered:
        - "rate-limiter-flexible with Redis — over-engineered for single server"
        - "Custom middleware with pg counters — reinventing the wheel"
    - topic: "Password reset token storage"
      decision: "SHA-256 hash of token stored in database, raw token sent in email"
      rationale: |
        Same pattern as password hashing — if the database is compromised,
        tokens cannot be used. crypto.randomBytes(32) provides 256 bits of
        entropy. Token hashed with SHA-256 before storage.
      alternatives_considered:
        - "Store raw token — vulnerable if database is compromised"
        - "JWT-based reset tokens — adds complexity, no session invalidation"
    - topic: "Testing framework"
      decision: "Vitest"
      rationale: |
        Constitution follow-up todos explicitly mention Vitest.
        Fast, ESM-native, TypeScript-first, compatible with Vite toolchain.
      alternatives_considered:
        - "Jest — CommonJS-centric, slower, requires more configuration"
        - "Node.js test runner — too minimal for project needs"
    - topic: "Email for development/testing"
      decision: "Ethereal (Nodemailer test accounts) for dev, console fallback"
      rationale: |
        Ethereal provides real SMTP without sending actual emails.
        Console fallback logs email content when no SMTP is configured,
        enabling development without any external service.
      alternatives_considered:
        - "Mailhog Docker container — requires Docker, heavier setup"
        - "Skip emails in dev — hides bugs in email templates"

data_model:
  entities:
    - name: "User"
      description: "A person who uses Smarted to study with flashcards"
      fields:
        - name: "id"
          type: "UUID"
          description: "Primary key, auto-generated"
          constraints: "NOT NULL, DEFAULT gen_random_uuid()"
        - name: "email"
          type: "VARCHAR(255)"
          description: "Login identifier, stored lowercase"
          constraints: "NOT NULL, UNIQUE"
        - name: "password_hash"
          type: "VARCHAR(255)"
          description: "bcrypt hash of user password"
          constraints: "NOT NULL"
        - name: "name"
          type: "VARCHAR(255)"
          description: "Optional display name"
          constraints: "NULL allowed"
        - name: "email_verified"
          type: "BOOLEAN"
          description: "Whether user has verified their email address"
          constraints: "NOT NULL, DEFAULT false"
        - name: "created_at"
          type: "TIMESTAMPTZ"
          description: "Account creation timestamp"
          constraints: "NOT NULL, DEFAULT NOW()"
      relationships:
        - target: "Workspace"
          type: "one-to-many"
          description: "User owns multiple workspaces"
        - target: "PasswordResetToken"
          type: "one-to-many"
          description: "User can have reset tokens"
        - target: "EmailVerificationToken"
          type: "one-to-many"
          description: "User can have verification tokens"

    - name: "PasswordResetToken"
      description: "Time-limited token for password reset flow"
      fields:
        - name: "id"
          type: "UUID"
          description: "Primary key"
          constraints: "NOT NULL, DEFAULT gen_random_uuid()"
        - name: "user_id"
          type: "UUID"
          description: "User who requested the reset"
          constraints: "NOT NULL, REFERENCES users(id) ON DELETE CASCADE"
        - name: "token_hash"
          type: "VARCHAR(255)"
          description: "SHA-256 hash of the reset token"
          constraints: "NOT NULL"
        - name: "expires_at"
          type: "TIMESTAMPTZ"
          description: "Token expiration (1 hour from creation)"
          constraints: "NOT NULL"
        - name: "used_at"
          type: "TIMESTAMPTZ"
          description: "When the token was consumed (NULL if unused)"
          constraints: "NULL allowed"
        - name: "created_at"
          type: "TIMESTAMPTZ"
          description: "Token creation timestamp"
          constraints: "NOT NULL, DEFAULT NOW()"
      relationships:
        - target: "User"
          type: "many-to-one"
          description: "Token belongs to a user"

    - name: "EmailVerificationToken"
      description: "Token for email address verification"
      fields:
        - name: "id"
          type: "UUID"
          description: "Primary key"
          constraints: "NOT NULL, DEFAULT gen_random_uuid()"
        - name: "user_id"
          type: "UUID"
          description: "User to verify"
          constraints: "NOT NULL, REFERENCES users(id) ON DELETE CASCADE"
        - name: "token_hash"
          type: "VARCHAR(255)"
          description: "SHA-256 hash of the verification token"
          constraints: "NOT NULL"
        - name: "expires_at"
          type: "TIMESTAMPTZ"
          description: "Token expiration (24 hours from creation)"
          constraints: "NOT NULL"
        - name: "used_at"
          type: "TIMESTAMPTZ"
          description: "When the token was consumed (NULL if unused)"
          constraints: "NULL allowed"
        - name: "created_at"
          type: "TIMESTAMPTZ"
          description: "Token creation timestamp"
          constraints: "NOT NULL, DEFAULT NOW()"
      relationships:
        - target: "User"
          type: "many-to-one"
          description: "Token belongs to a user"

api_contracts:
  endpoints:
    - method: "POST"
      path: "/api/auth/register"
      description: "Register a new user account (existing endpoint — enhanced with password validation and email verification trigger)"
      request:
        content_type: "application/json"
        body_schema: "{ email: string, password: string, name?: string }"
      response:
        success_code: 201
        body_schema: "{ data: { id: string, email: string, name: string | null, email_verified: boolean, created_at: string } }"
      errors:
        - code: 400
          description: "Password does not meet minimum requirements (8+ characters)"
        - code: 409
          description: "Email already registered"

    - method: "POST"
      path: "/api/auth/login"
      description: "Authenticate with email and password (existing endpoint — enhanced with generic error messages)"
      request:
        content_type: "application/json"
        body_schema: "{ email: string, password: string }"
      response:
        success_code: 200
        body_schema: "{ data: { id: string, email: string, name: string | null, email_verified: boolean, created_at: string } }"
      errors:
        - code: 401
          description: "Invalid email or password (generic, does not reveal email existence)"
        - code: 429
          description: "Too many login attempts, try again later"

    - method: "POST"
      path: "/api/auth/logout"
      description: "Destroy the current session (existing endpoint — unchanged)"
      request:
        content_type: "application/json"
        body_schema: "{}"
      response:
        success_code: 200
        body_schema: "{ ok: true }"
      errors: []

    - method: "GET"
      path: "/api/auth/me"
      description: "Get current authenticated user (existing endpoint — adds email_verified field)"
      request:
        content_type: "application/json"
        body_schema: "N/A"
      response:
        success_code: 200
        body_schema: "{ data: { id: string, email: string, name: string | null, email_verified: boolean, created_at: string } }"
      errors:
        - code: 401
          description: "Not authenticated"

    - method: "POST"
      path: "/api/auth/forgot-password"
      description: "Request a password reset email"
      request:
        content_type: "application/json"
        body_schema: "{ email: string }"
      response:
        success_code: 200
        body_schema: "{ data: { message: string } }"
      errors:
        - code: 429
          description: "Too many reset requests, try again later"

    - method: "POST"
      path: "/api/auth/reset-password"
      description: "Reset password using a valid token from the reset email"
      request:
        content_type: "application/json"
        body_schema: "{ token: string, password: string }"
      response:
        success_code: 200
        body_schema: "{ data: { message: string } }"
      errors:
        - code: 400
          description: "Token is invalid, expired, or already used; or password does not meet requirements"

    - method: "POST"
      path: "/api/auth/change-password"
      description: "Change password for the authenticated user"
      request:
        content_type: "application/json"
        body_schema: "{ currentPassword: string, newPassword: string }"
      response:
        success_code: 200
        body_schema: "{ data: { message: string } }"
      errors:
        - code: 400
          description: "New password does not meet requirements"
        - code: 401
          description: "Not authenticated or current password is incorrect"

    - method: "POST"
      path: "/api/auth/verify-email"
      description: "Verify email address using token from verification email"
      request:
        content_type: "application/json"
        body_schema: "{ token: string }"
      response:
        success_code: 200
        body_schema: "{ data: { message: string } }"
      errors:
        - code: 400
          description: "Token is invalid, expired, or already used"

    - method: "POST"
      path: "/api/auth/resend-verification"
      description: "Resend email verification link"
      request:
        content_type: "application/json"
        body_schema: "{}"
      response:
        success_code: 200
        body_schema: "{ data: { message: string } }"
      errors:
        - code: 401
          description: "Not authenticated"
        - code: 429
          description: "Too many requests, try again later"

