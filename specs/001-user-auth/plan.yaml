plan:
  branch: "001-user-auth"
  created: "2026-03-16"
  spec_path: "specs/001-user-auth/spec.yaml"

summary: |
  This plan extends the existing session-based authentication in Smarted to cover password reset,
  password change, email verification, rate limiting, and hardened security controls. The MVP already
  has register, login, logout, and session persistence — this feature completes the auth surface area
  specified in the spec.

  Key technical decisions: Nodemailer for email delivery (SMTP-agnostic, works with any provider),
  express-rate-limit for brute-force protection, and Node.js crypto.randomBytes for secure token
  generation. All new code follows the established patterns — parameterized SQL in db/queries/,
  thin Express route handlers, typed shared interfaces, and MVM on the frontend. A new database
  migration adds the email_verified column and password_reset_tokens table.

technical_context:
  language: "TypeScript"
  framework: "Express.js (server) + React 19 (client)"
  primary_dependencies:
    - name: "express"
      version: "^4.21.0"
      purpose: "HTTP server framework (existing)"
    - name: "express-session"
      version: "^1.18.1"
      purpose: "Session management with cookies (existing)"
    - name: "bcrypt"
      version: "^5.1.1"
      purpose: "Password hashing (existing)"
    - name: "pg"
      version: "^8.13.0"
      purpose: "PostgreSQL client (existing)"
    - name: "nodemailer"
      version: "^6.9.0"
      purpose: "Email delivery for password reset and verification"
    - name: "express-rate-limit"
      version: "^7.0.0"
      purpose: "Rate limiting on auth endpoints to prevent brute force"
    - name: "vitest"
      version: "^3.0.0"
      purpose: "Unit and integration testing framework"
  storage: "PostgreSQL (existing)"
  testing:
    framework: "Vitest"
    approach: |
      Unit tests for query functions, services, and validation logic.
      Integration tests for auth route handlers using supertest.
      Frontend component tests deferred to a later feature.
  target_platform: "Web (Node.js server + browser client)"
  project_type: "web"
  performance_goals: "95th percentile login/register response under 2 seconds"
  constraints:
    - "Must integrate with existing PostgreSQL schema (additive migration only)"
    - "Must maintain session-based auth approach (no JWT)"
    - "Email delivery requires SMTP configuration (environment variables)"
    - "Rate limiting must not block legitimate users (10 failed attempts per 15 min)"
    - "All new SQL must use parameterized queries"
  scale_scope: "Single-server deployment, hundreds of concurrent users"

